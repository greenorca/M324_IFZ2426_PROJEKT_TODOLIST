# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x] # Note: Node 26 does not exist yet. Current LTS is 20/22. Using 26 will cause "Version not found" error.

    steps:
    - uses: actions/checkout@v4
    
    - name: Check directory structure
      run: ls -R

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # Explicitly point to the lockfile relative to repo root
        cache-dependency-path: frontend/package-lock.json 
        
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
      
    - name: Build
      working-directory: frontend
      run: npm run build --if-present
      
    - name: Test
      working-directory: frontend
      run: npm test
      
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist 
        retention-days: 5 # Optional: How long to keep the file (default is 90)
