services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB_USER:-task_db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-task_db_password}
      MYSQL_DATABASE: ${DB_NAME:-task_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: greenorca/m324_backend:main
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-task_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-task_db_password}
      DB_NAME: ${DB_NAME:-task_db}
      FRONTEND_URL: http://localhost:8081
    depends_on:
      - mysql

  frontend:
    image: greenorca/m324_frontend:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend:8080
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
