services:
  mysql:
    image: mysql:8.0
    container_name: mysql-task-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: task_db_user
      MYSQL_PASSWORD: task_db_password
      MYSQL_DATABASE: task_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
